<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeetAbroad - Free Dating</title>
<style>
body{font-family:Arial;background:#111;color:white;margin:0;text-align:center}
.card{width:90%;max-width:350px;height:500px;background:white;color:black;border-radius:20px;margin:20px auto;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(255,0,80,0.5)}
.card img{width:100%;height:70%;object-fit:cover}
.info{padding:15px;text-align:left}
.badge{background:#ff2d55;color:white;padding:5px 10px;border-radius:10px;font-size:12px}
.btns{display:flex;justify-content:center;gap:30px;margin:20px}
.btn{width:60px;height:60px;border-radius:50%;border:none;font-size:30px;cursor:pointer}
.nope{background:white;color:red} .like{background:#ff2d55;color:white}
.nav{position:fixed;bottom:0;width:100%;background:black;display:flex;justify-content:space-around;padding:15px 0}
</style>
</head>
<body>
<h1>🌍 MeetAbroad - 100% FREE</h1>
<p>No payment. Meet people abroad. Swipe free forever.</p>
<div id="card-container"></div>
<div class="btns">
<button class="btn nope" onclick="swipe('left')">✕</button>
<button class="btn like" onclick="swipe('right')">♥</button>
</div>
<script>
const users=[
{name:"Amara, 24",country:"🇳🇬 Nigeria",bio:"Love travel & music",img:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce"},
{name:"Jake, 26",country:"🇺🇸 USA",bio:"Abroad in SA, let's meet",img:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d"},
{name:"Sofia, 23",country:"🇧🇷 Brazil",bio:"Learn English, teach Portuguese",img:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e"},
{name:"Thandi, 25",country:"🇿🇦 South Africa",bio:"Cape Town, free dating",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1"}
];
let i=0;
function showCard(){
const u=users[i%users.length];
document.getElementById('card-container').innerHTML=`<div class="card"><img src="${u.img}"><div class="info"><h2>${u.name} <span class="badge">${u.country}</span></h2><p>${u.bio}</p></div></div>`;
}
function swipe(dir){
if(dir==='right'){alert('You liked '+users[i%users.length].name+'! If they like you back, you match - FREE CHAT!');}
i++;showCard();
}
showCard();
</script>
</body>
</html>
